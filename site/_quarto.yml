project:
  type: website
  output-dir: _site
  resources:
    - downloads/
    - examples/
    - video/
    - images/

website:
  title: "Agentic Coding with Claude"
  description: "A hands-on introduction to Claude Code from NC State University Libraries' Data Science Services."
  site-url: "https://ncsu-libraries.github.io/agentic-coding-with-claude/"
  repo-url: "https://github.com/NCSU-Libraries/agentic-coding-with-claude"
  favicon: images/favicon.svg
  page-navigation: true
  bread-crumbs: false
  navbar:
    background: "#CC0000"
    foreground: "#FFFFFF"
    logo: images/lib_logo_white.png
    logo-alt: "NC State University Libraries"
    title: false
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: setup.qmd
        text: Setup
      - text: Activities
        menu:
          - href: activity/study-rooms.qmd
            text: "Study-room bookings"
          - href: activity/cafe.qmd
            text: "Campus café sales"
      - href: cheatsheet.qmd
        text: Cheat sheet
      - href: examples.qmd
        text: Examples
    right:
      - text: Slides
        menu:
          - href: slides/study-rooms.qmd
            text: "Slides: study-room bookings"
          - href: slides/cafe.qmd
            text: "Slides: campus café sales"
      - icon: github
        href: "https://github.com/NCSU-Libraries/agentic-coding-with-claude"
        aria-label: "Source on GitHub"
  page-footer:
    left: "NC State University Libraries · [Data Science Services](https://www.lib.ncsu.edu/staff/department/data-science-services) · Help: [go.ncsu.edu/getdatahelp](https://go.ncsu.edu/getdatahelp)"
    right: "Content [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Code MIT · Data synthetic"

format:
  html:
    theme:
      light: [cosmo, theme/site.scss]
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    lang: en
